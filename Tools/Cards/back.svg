<svg xmlns="http://www.w3.org/2000/svg" width="103.2" height="168.2" viewBox="0 0 103.2 168.2">
  <!-- 화투 뒷면 (직접 그림, 프로젝트와 같은 라이선스). 막힌 칸과 타이틀 장식에 쓴다. -->
  <defs>
    <pattern id="lattice" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45 51.6 84.1)">
      <rect width="12" height="12" fill="#b3121f"/>
      <path d="M0 0H12M0 0V12" stroke="#d63a3a" stroke-width="1.6"/>
      <circle cx="6" cy="6" r="1.4" fill="#8e0d18"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.6" y="0.6" width="102" height="167" rx="8" fill="#7a0a14"/>
  <rect x="4" y="4" width="95.2" height="160.2" rx="5.5" fill="url(#lattice)"/>
  <rect x="4" y="4" width="95.2" height="160.2" rx="5.5" fill="none" stroke="#f2c14e" stroke-width="1.4"/>
  <rect x="8" y="8" width="87.2" height="152.2" rx="3.5" fill="none" stroke="#f2c14e" stroke-width="0.6" stroke-dasharray="2 1.5"/>
  <circle cx="51.6" cy="84.1" r="19" fill="#7a0a14" stroke="#f2c14e" stroke-width="1.6"/>
  <circle cx="51.6" cy="84.1" r="15" fill="none" stroke="#f2c14e" stroke-width="0.6"/>
  <g fill="#f2c14e" transform="translate(51.6 84.1)">
    <!-- 다섯 잎 꽃 -->
    <g id="petal"><ellipse cx="0" cy="-7.2" rx="3.6" ry="5.6"/></g>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
    <circle r="2.6" fill="#7a0a14"/>
  </g>
  <rect x="0.6" y="0.6" width="102" height="167" rx="8" fill="url(#shine)"/>
</svg>
